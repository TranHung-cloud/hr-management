spring.application.name=backend
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/hr
spring.config.import=optional:file:./config/application-local.properties
spring.datasource.username=postgres
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.time-zone=Asia/Bangkok
app.interview-duration-minutes=${INTERVIEW_DURATION_MINUTES:60}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
