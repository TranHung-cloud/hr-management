spring.application.name=backend
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.config.import=optional:classpath:application-local.properties

# JWT Configuration
jwt.secret=${SESSION_SECRET}
jwt.expiration-ms=86400000

# Spring Mail (Gmail SMTP configuration template)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=hrmanagement300@gmail.com
spring.mail.password=${MAIL_PASSWORD}

spring.mail.prop
spring.mail.username=herties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# db
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/hr
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.time-zone=Asia/Bangkok